<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark navy base with subtle rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Glowing K / Graduation / Book Emblem -->
  <!-- Central Graduation Cap Peak -->
  <path d="M 256 120 L 400 196 L 256 272 L 112 196 Z" fill="url(#blueGrad)" filter="url(#glow)"/>
  <path d="M 256 120 L 400 196 L 256 272 L 112 196 Z" fill="url(#blueGrad)"/>

  <!-- Golden Tassel & Lamp Sparkle -->
  <path d="M 372 210 L 372 280 A 12 12 0 0 1 348 280 L 348 223" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="348" cy="285" r="10" fill="url(#goldGrad)"/>

  <!-- Lower Book Wings / Foundation -->
  <path d="M 140 240 L 256 304 L 372 240 L 372 310 C 372 355 256 400 256 400 C 256 400 140 355 140 310 Z" fill="url(#blueGrad)" opacity="0.95"/>

  <!-- Open Page Accent Line -->
  <path d="M 160 305 Q 256 350 352 305" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 304 L 256 395" fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Warm glow light star at apex -->
  <circle cx="256" cy="120" r="8" fill="#fbbf24" filter="url(#glow)"/>
</svg>