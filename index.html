    <!-- Safe fetch getter/setter patch for iframe sandboxes and strict environments -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = null;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
            (typeof Window !== 'undefined' && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch'));

          // If fetch has a getter without a setter, or to ensure assignment never throws:
          if (!desc || typeof desc.set !== 'function') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || (originalFetch ? originalFetch.bind(window) : originalFetch);
              },
              set: function(fn) {
                customFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Safeguard: do not let patch throw
        }
      })();
    </script>
